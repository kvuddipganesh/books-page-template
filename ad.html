<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Books</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f4f4f4;
            font-size: 1.2em;
        }

        .book {
            text-align: center;
            padding: 20px;
            border: 1px solid #ccc;
            margin: 10px auto;
            position: relative; 
        }

        .book img {
            width: 150px;
            height: 250px;
            margin-bottom: 20px;
            transition: transform 0.3s;
        }

        .book img:hover {
            transform: scale(1.1);
        }

        .book1 { background-color: #FFFFE0; }
        .book2 { background-color: #ADD8E6; } 
        .book3 { background-color: #8FBC8F}
        .book4 { background-color: #696969 } 
        .book5 { background-color: #D2A679} 
        .book6 { background-color: #FFE4C4 } 
        .book7 { background-color: #FFA07A } 
        .book8 { background-color: #E0FFFF; } 
        .book9 { background-color:  #F0F8FF ; } 
        .book10 { background-color: #E6E6FA; } 
        .book11 { background-color: #FFB6C1; } 
        .book12 { background-color: #ADD8E6; }

        .more-info {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%); 
            background-color: #4CAF50; 
            color: white;
            border: none;
            padding: 5px 10px;
            text-decoration: none;
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <center><h1>Books</h1></center>
    <table>
        <tr>
            <td>
                <div class="book book1">
                    <img src="1.jpg" alt="Book 1">
                    <button class="more-info">More Info</button>
                </div>
            </td>
            <td>
                <div class="book book2">
                    <img src="2.jpg" alt="Book 2">
                    <button class="more-info">More Info</button>
                </div>
            </td>
            <td>
                <div class="book book3">
                    <img src="3.jpg" alt="Book 3">
                    <button class="more-info">More Info</button>
                </div>
            </td>
        </tr>
        <tr>
            <td>
                <div class="book book4">
                    <img src="4.jpg" alt="Book 4">
                    <button class="more-info">More Info</button>
                </div>
            </td>
            <td>
                <div class="book book5">
                    <img src="5.jpeg" alt="Book 5">
                    <button class="more-info">More Info</button>
                </div>
            </td>
            <td>
                <div class="book book6">
                    <img src="6.jpg" alt="Book 6">
                    <button class="more-info">More Info</button>
                </div>
            </td>
        </tr>
        <tr>
            <td>
                <div class="book book7">
                    <img src="7.jpg" alt="Book 7">
                    <button class="more-info">More Info</button>
                </div>
            </td>
            <td>
                <div class="book book8">
                    <img src="8.jpg" alt="Book 8">
                    <button class="more-info">More Info</button>
                </div>
            </td>
            <td>
                <div class="book book9">
                    <img src="9.png" alt="Book 9">
                    <button class="more-info">More Info</button>
                </div>
            </td>
        </tr>
        <tr>
            <td>
                <div class="book book10">
                    <img src="10.jpg" alt="Book 10">
                    <button class="more-info">More Info</button>
                </div>
            </td>
            <td>
                <div class="book book11">
                    <img src="11.jpg" alt="Book 11">
                    <button class="more-info">More Info</button>
                </div>
            </td>
            <td>
                <div class="book book12">
                    <img src="12.jpg" alt="Book 12">

            </td>
        </tr>
    </table>
</body>
</html>
